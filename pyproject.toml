[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garbage-time-tracker"
version = "0.1.0"
description = "농구 중계 영상 스코어버그 인식 + 코트 라인 기반 2점/3점 판정"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gtt = "gtt.cli:main"

[tool.setuptools]
packages = ["gtt"]

[tool.setuptools.package-data]
gtt = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
